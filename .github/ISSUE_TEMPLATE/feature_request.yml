name: Feature request
description: Suggest something Typescape should do.
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do with your solution, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How Typescape could help. Rough ideas are fine.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other tools you have tried, if any.
